name: CI

on:
  push:
    branches: [main, codex/initial-memory]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile work_memory.py memory_hooks.py learning.py background.py install.py
      - name: Tests and process-kill recovery
        run: python -m unittest discover -s tests -v
      - name: CLI
        run: python work_memory.py --version
